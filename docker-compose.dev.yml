name: ticket-panel-dev-local

services:
    painel-node-dev-local:
        image: node:26-bookworm-slim
        restart: always
        working_dir: /app
        ports:
            - "3000:3000"
        volumes:
            - ./:/app
        command: sh -c "npm install && npm start"
        environment:
            NODE_ENV: development
            TZ: America/Sao_Paulo