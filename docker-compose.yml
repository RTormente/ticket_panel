name: ticket-panel

services:
    ticket-panel:
        build:
            context: .
            dockerfile: Dockerfile
        image: rtormente/ticket-panel:latest
        restart: always
        ports:
            - "80:3000"
        environment:
            TZ: America/Sao_Paulo
        volumes:
            - painel_data:/app/backend/data

volumes:
    painel_data: